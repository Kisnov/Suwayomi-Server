name: Fork Docker image

# Publishes ghcr.io/kisnov/suwayomi-server: the official preview image with this fork's server jar.
# The official images are built in Suwayomi/Suwayomi-Server-docker, which forks can't trigger.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish Docker image
    if: github.repository == 'Kisnov/Suwayomi-Server'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build Jar
        env:
          ProductBuildType: "Preview"
        run: ./gradlew :server:shadowJar --stacktrace

      - name: Prepare image context
        run: |
          mkdir docker-context
          jars=(server/build/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one jar, found: ${jars[*]}"
            exit 1
          fi
          cp "${jars[0]}" docker-context/tachidesk_latest.jar
          cat > docker-context/Dockerfile <<'EOF'
          FROM ghcr.io/suwayomi/suwayomi-server:preview
          COPY tachidesk_latest.jar /home/suwayomi/startup/tachidesk_latest.jar
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/Kisnov/Suwayomi-Server
          tags: |
            ghcr.io/kisnov/suwayomi-server:latest
            ghcr.io/kisnov/suwayomi-server:${{ github.sha }}
